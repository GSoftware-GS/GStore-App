<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline PDF Merger & Editor</title>
  <meta name="description" content="Merge, edit, and watermark PDFs natively. Zero servers.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- PDF-LIB CDN -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="../index.html" class="back-btn">← Back to GStore</a>

  <header class="app-header">
    <div class="logo">
      <h1>PDF Studio Offline</h1>
      <p>Merge multiple PDFs and inject watermarks. 100% Privacy.</p>
    </div>
  </header>

  <div class="container">
    <div class="card glass-card">
      
      <!-- Upload Dropzone (Supports Multiple) -->
      <div id="dropzone" class="dropzone">
        <svg viewBox="0 0 24 24" width="50" height="50" fill="var(--muted)">
          <path d="M14 2H6c-1.11 0-2 .89-2 2v16c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h6v6h5v10H6zm3.5-3.5L12 14l2.5 2.5 1.41-1.41L13.41 12.6l2.5-2.5L14.5 8.69 12 11.19l-2.5-2.5L8.09 10.1l2.5 2.5-2.5 2.5L9.5 16.5z"/>
        </svg>
        <h3>Drop PDFs Here to Merge</h3>
        <span>You can select multiple files at once</span>
        <input type="file" id="file-input" accept="application/pdf" multiple hidden>
      </div>

      <!-- File Queue UI -->
      <div id="file-queue-container" class="form-group hidden" style="margin-top: 1.5rem;">
        <label>Files to Merge (Order sensitive):</label>
        <div id="file-list" class="file-list"></div>
      </div>

      <hr class="separator">

      <!-- Edit Global Controls -->
      <div class="edit-layout">
        <div class="form-group-row">
          <div class="form-group">
            <label>Giant Watermark Text</label>
            <input type="text" id="watermark-input" placeholder="e.g. CONFIDENTIAL">
          </div>
          <div class="form-group">
            <label>Master Title Metadata</label>
            <input type="text" id="title-input" placeholder="Resulting PDF Title">
          </div>
        </div>

        <div class="actions">
          <button id="clear-btn" class="btn outline-btn hidden">Clear Board</button>
          <button id="process-btn" class="btn primary-btn disabled">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Merge & Download
          </button>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast hidden">PDF Generated & Merged!</div>

  <footer>
    Made with <span>♥</span> by <a href="https://linkedin.com/in/gonza" target="_blank">Gonzalo</a><br>
    Your documents never leave your local RAM. Like iLovePDF, but totally private.
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
